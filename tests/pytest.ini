[pytest]
# Pytest configuration for 3-tier routing tests

# Minimum pytest version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Asyncio mode
asyncio_mode = auto

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multi-component flows
    e2e: End-to-end scenario tests
    performance: Performance and load tests
    slow: Tests that take longer than 5 seconds
    l1: Tests for L1 agents
    l2: Tests for L2 agents
    l3: Tests for L3 agents
    routing: Tests for routing logic
    clarification: Tests for clarification handling
    escalation: Tests for human escalation

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    -ra
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
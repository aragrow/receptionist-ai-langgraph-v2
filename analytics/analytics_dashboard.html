<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Receptionist Analytics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fa;
            color: #2d3748;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 32px;
            color: #1a202c;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #718096;
            font-size: 16px;
        }
        
        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .controls label {
            font-weight: 600;
            color: #4a5568;
        }
        
        .controls select, .controls button {
            padding: 10px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .controls button {
            background: #4299e1;
            color: white;
            border: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .controls button:hover {
            background: #3182ce;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .metric-card h3 {
            font-size: 14px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        
        .metric-value {
            font-size: 36px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 5px;
        }
        
        .metric-label {
            font-size: 14px;
            color: #a0aec0;
        }
        
        .metric-good {
            color: #48bb78;
        }
        
        .metric-warning {
            color: #ed8936;
        }
        
        .metric-danger {
            color: #f56565;
        }
        
        .section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .section h2 {
            font-size: 24px;
            color: #1a202c;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f7fafc;
        }
        
        .stat-row:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            font-weight: 600;
            color: #4a5568;
        }
        
        .stat-value {
            color: #2d3748;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: #a0aec0;
            font-size: 18px;
        }
        
        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .progress-bar {
            background: #e2e8f0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: #4299e1;
            transition: width 0.3s;
        }
        
        .timestamp {
            text-align: right;
            color: #a0aec0;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 AI Receptionist Analytics</h1>
            <p class="subtitle">Real-time performance metrics and monitoring dashboard</p>
        </header>
        
        <div class="controls">
            <label for="timeWindow">Time Window:</label>
            <select id="timeWindow">
                <option value="1">Last Hour</option>
                <option value="6">Last 6 Hours</option>
                <option value="24" selected>Last 24 Hours</option>
                <option value="72">Last 3 Days</option>
                <option value="168">Last Week</option>
            </select>
            <button onclick="loadDashboard()">Refresh</button>
            <button onclick="autoRefresh()">Auto-Refresh: OFF</button>
        </div>
        
        <div id="dashboard">
            <div class="loading">Loading dashboard...</div>
        </div>
    </div>
    
    <script>
        let autoRefreshInterval = null;
        let isAutoRefresh = false;
        const API_BASE = '/analytics';
        
        async function fetchData(endpoint) {
            try {
                const response = await fetch(endpoint);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('Fetch error:', error);
                throw error;
            }
        }
        
        function formatNumber(num) {
            if (num === null || num === undefined) return 'N/A';
            return typeof num === 'number' ? num.toFixed(2) : num;
        }
        
        function formatPercent(num) {
            if (num === null || num === undefined) return 'N/A';
            return `${(num * 100).toFixed(1)}%`;
        }
        
        function getConfidenceClass(confidence) {
            if (confidence >= 0.75) return 'metric-good';
            if (confidence >= 0.4) return 'metric-warning';
            return 'metric-danger';
        }
        
        async function loadDashboard() {
            const timeWindow = document.getElementById('timeWindow').value;
            const dashboardDiv = document.getElementById('dashboard');
            
            try {
                dashboardDiv.innerHTML = '<div class="loading">Loading dashboard...</div>';
                
                const data = await fetchData(`${API_BASE}/dashboard?time_window_hours=${timeWindow}`);
                
                if (!data.success || !data.data) {
                    throw new Error('Invalid response format');
                }
                
                const metrics = data.data;
                renderDashboard(metrics);
                
            } catch (error) {
                dashboardDiv.innerHTML = `
                    <div class="error">
                        <strong>Error loading dashboard:</strong> ${error.message}
                    </div>
                `;
            }
        }
        
        function renderDashboard(data) {
            const dashboard = document.getElementById('dashboard');
            
            const sessionSummary = data.session_summary || {};
            const l1Class = data.l1_classification || {};
            const l2Conf = data.l2_confidence || {};
            const escalations = data.escalations || {};
            const clarifications = data.clarifications || {};
            const l3Success = data.l3_success_rates || {};
            const routing = data.routing_performance || {};
            
            dashboard.innerHTML = `
                <!-- Key Metrics -->
                <div class="metrics-grid">
                    <div class="metric-card">
                        <h3>Total Sessions</h3>
                        <div class="metric-value">${sessionSummary.total_sessions || 0}</div>
                        <div class="metric-label">in last ${data.time_window_hours}h</div>
                    </div>
                    
                    <div class="metric-card">
                        <h3>Success Rate</h3>
                        <div class="metric-value ${getConfidenceClass(sessionSummary.success_rate || 0)}">
                            ${formatPercent(sessionSummary.success_rate)}
                        </div>
                        <div class="metric-label">completed successfully</div>
                    </div>
                    
                    <div class="metric-card">
                        <h3>Escalation Rate</h3>
                        <div class="metric-value ${escalations.escalation_rate > 0.2 ? 'metric-warning' : 'metric-good'}">
                            ${formatPercent(escalations.escalation_rate)}
                        </div>
                        <div class="metric-label">${escalations.total_escalations || 0} escalations</div>
                    </div>
                    
                    <div class="metric-card">
                        <h3>Avg Duration</h3>
                        <div class="metric-value">${formatNumber(sessionSummary.avg_duration_seconds)}s</div>
                        <div class="metric-label">per session</div>
                    </div>
                </div>
                
                <!-- L1 Classification -->
                <div class="section">
                    <h2>L1 Classification Performance</h2>
                    ${renderL1Section(l1Class, data.l1_confidence)}
                </div>
                
                <!-- L2 Refinement -->
                <div class="section">
                    <h2>L2 Intent Refinement</h2>
                    ${renderL2Section(l2Conf)}
                </div>
                
                <!-- L3 Execution -->
                <div class="section">
                    <h2>L3 Agent Success Rates</h2>
                    ${renderL3Section(l3Success)}
                </div>
                
                <!-- Routing Performance -->
                <div class="section">
                    <h2>Routing Performance</h2>
                    ${renderRoutingSection(routing)}
                </div>
                
                <!-- Clarifications -->
                <div class="section">
                    <h2>Clarification Requests</h2>
                    ${renderClarificationSection(clarifications)}
                </div>
                
                <!-- Escalations -->
                <div class="section">
                    <h2>Human Escalations</h2>
                    ${renderEscalationSection(escalations)}
                </div>
                
                <div class="timestamp">
                    Last updated: ${new Date(data.generated_at).toLocaleString()}
                </div>
            `;
        }
        
        function renderL1Section(l1Class, l1Conf) {
            if (!l1Class || l1Class.error) {
                return '<p>No L1 data available</p>';
            }
            
            const confDist = l1Conf?.distribution || {};
            
            return `
                <div class="stat-row">
                    <span class="stat-label">Total Classifications</span>
                    <span class="stat-value">${l1Class.total_classifications || 0}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Average Confidence</span>
                    <span class="stat-value ${getConfidenceClass(l1Class.avg_confidence || 0)}">
                        ${formatNumber(l1Class.avg_confidence)}
                    </span>
                </div>
                ${l1Class.accuracy !== 'No feedback data available' ? `
                <div class="stat-row">
                    <span class="stat-label">Accuracy (with feedback)</span>
                    <span class="stat-value">${formatPercent(l1Class.accuracy)}</span>
                </div>
                ` : ''}
                
                <h3 style="margin-top: 20px; margin-bottom: 10px;">Confidence Distribution</h3>
                ${renderConfidenceBar('High (≥0.75)', confDist['high (≥0.75)'], 'metric-good')}
                ${renderConfidenceBar('Medium (0.4-0.74)', confDist['medium (0.4-0.74)'], 'metric-warning')}
                ${renderConfidenceBar('Low (<0.4)', confDist['low (<0.4)'], 'metric-danger')}
            `;
        }
        
        function renderL2Section(l2Conf) {
            if (!l2Conf || l2Conf.error) {
                return '<p>No L2 data available</p>';
            }
            
            const confDist = l2Conf.distribution || {};
            
            return `
                <div class="stat-row">
                    <span class="stat-label">Total Refinements</span>
                    <span class="stat-value">${l2Conf.total_samples || 0}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Average Confidence</span>
                    <span class="stat-value ${getConfidenceClass(l2Conf.avg_confidence || 0)}">
                        ${formatNumber(l2Conf.avg_confidence)}
                    </span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Median Confidence</span>
                    <span class="stat-value">${formatNumber(l2Conf.median_confidence)}</span>
                </div>
                
                <h3 style="margin-top: 20px; margin-bottom: 10px;">Confidence Distribution</h3>
                ${renderConfidenceBar('High (≥0.75)', confDist['high (≥0.75)'], 'metric-good')}
                ${renderConfidenceBar('Medium (0.4-0.74)', confDist['medium (0.4-0.74)'], 'metric-warning')}
                ${renderConfidenceBar('Low (<0.4)', confDist['low (<0.4)'], 'metric-danger')}
            `;
        }
        
        function renderL3Section(l3Success) {
            if (!l3Success || l3Success.error) {
                return '<p>No L3 data available</p>';
            }
            
            const byAgent = l3Success.by_agent || {};
            
            let html = `
                <div class="stat-row">
                    <span class="stat-label">Total Executions</span>
                    <span class="stat-value">${l3Success.total_executions || 0}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Overall Success Rate</span>
                    <span class="stat-value ${getConfidenceClass(l3Success.overall_success_rate || 0)}">
                        ${formatPercent(l3Success.overall_success_rate)}
                    </span>
                </div>
                
                <h3 style="margin-top: 20px; margin-bottom: 10px;">By Agent</h3>
            `;
            
            for (const [agent, stats] of Object.entries(byAgent)) {
                html += `
                    <div class="stat-row">
                        <span class="stat-label">${agent}</span>
                        <span class="stat-value ${getConfidenceClass(stats.success_rate)}">
                            ${formatPercent(stats.success_rate)} (${stats.success_count}/${stats.total_count})
                        </span>
                    </div>
                `;
            }
            
            return html;
        }
        
        function renderRoutingSection(routing) {
            if (!routing || routing.error) {
                return '<p>No routing data available</p>';
            }
            
            const byTransition = routing.by_transition || {};
            
            let html = `
                <div class="stat-row">
                    <span class="stat-label">Total Routings</span>
                    <span class="stat-value">${routing.total_routings || 0}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Average Routing Time</span>
                    <span class="stat-value">${formatNumber(routing.avg_routing_time_ms)}ms</span>
                </div>
                
                <h3 style="margin-top: 20px; margin-bottom: 10px;">By Transition</h3>
            `;
            
            for (const [transition, stats] of Object.entries(byTransition)) {
                html += `
                    <div class="stat-row">
                        <span class="stat-label">${transition}</span>
                        <span class="stat-value">${formatNumber(stats.avg_ms)}ms (${stats.count} times)</span>
                    </div>
                `;
            }
            
            return html;
        }
        
        function renderClarificationSection(clarifications) {
            if (!clarifications || clarifications.error) {
                return '<p>No clarification data available</p>';
            }
            
            const byTier = clarifications.by_tier || {};
            
            let html = `
                <div class="stat-row">
                    <span class="stat-label">Total Clarifications</span>
                    <span class="stat-value">${clarifications.total_clarifications || 0}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Resolution Rate</span>
                    <span class="stat-value ${getConfidenceClass(clarifications.resolution_rate || 0)}">
                        ${formatPercent(clarifications.resolution_rate)}
                    </span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Avg Attempts Per Session</span>
                    <span class="stat-value">${formatNumber(clarifications.avg_attempts_per_session)}</span>
                </div>
                
                <h3 style="margin-top: 20px; margin-bottom: 10px;">By Tier</h3>
            `;
            
            for (const [tier, count] of Object.entries(byTier)) {
                html += `
                    <div class="stat-row">
                        <span class="stat-label">${tier}</span>
                        <span class="stat-value">${count}</span>
                    </div>
                `;
            }
            
            return html;
        }
        
        function renderEscalationSection(escalations) {
            if (!escalations || escalations.total_escalations === 0) {
                return '<p>No escalations in this time period</p>';
            }
            
            const byReason = escalations.by_reason || {};
            const byTier = escalations.by_tier || {};
            
            let html = `
                <div class="stat-row">
                    <span class="stat-label">Total Escalations</span>
                    <span class="stat-value">${escalations.total_escalations}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Escalation Rate</span>
                    <span class="stat-value ${escalations.escalation_rate > 0.2 ? 'metric-warning' : 'metric-good'}">
                        ${formatPercent(escalations.escalation_rate)}
                    </span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Avg Clarifications Before Escalation</span>
                    <span class="stat-value">${formatNumber(escalations.avg_clarification_attempts_before_escalation)}</span>
                </div>
                
                <h3 style="margin-top: 20px; margin-bottom: 10px;">By Reason</h3>
            `;
            
            for (const [reason, count] of Object.entries(byReason)) {
                html += `
                    <div class="stat-row">
                        <span class="stat-label">${reason}</span>
                        <span class="stat-value">${count}</span>
                    </div>
                `;
            }
            
            html += '<h3 style="margin-top: 20px; margin-bottom: 10px;">By Tier</h3>';
            
            for (const [tier, count] of Object.entries(byTier)) {
                html += `
                    <div class="stat-row">
                        <span class="stat-label">${tier}</span>
                        <span class="stat-value">${count}</span>
                    </div>
                `;
            }
            
            return html;
        }
        
        function renderConfidenceBar(label, data, colorClass) {
            if (!data) return '';
            
            const percentage = data.percentage || 0;
            
            return `
                <div style="margin-bottom: 15px;">
                    <div class="stat-row">
                        <span class="stat-label">${label}</span>
                        <span class="stat-value ${colorClass}">${data.count} (${percentage}%)</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${percentage}%; background: var(--color);"></div>
                    </div>
                </div>
            `;
        }
        
        function autoRefresh() {
            const button = event.target;
            isAutoRefresh = !isAutoRefresh;
            
            if (isAutoRefresh) {
                button.textContent = 'Auto-Refresh: ON';
                button.style.background = '#48bb78';
                autoRefreshInterval = setInterval(loadDashboard, 30000); // Refresh every 30s
            } else {
                button.textContent = 'Auto-Refresh: OFF';
                button.style.background = '#4299e1';
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
            }
        }
        
        // Load dashboard on page load
        window.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
